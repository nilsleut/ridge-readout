# config.yaml — ridge readout on full feature maps across the resolution sweep
#
# Frozen degrees of freedom for the ridge/readout study. Every value here is fixed
# BEFORE the first fit. The hash of this file (see code/ridge/config_hash.py) is
# written into every output CSV as column `config_hash`.
#
# Changing any value produces a different hash and therefore a different, clearly
# separated set of outputs. Do not edit this file to make a run succeed. If a run
# reveals that a value is wrong, that is a finding: record it, get sign-off, bump
# `schema_version`, and rerun everything downstream of the change.
#
# Companion documents:
#   PREREGISTRATION.md         — both outcomes, written before compute
#   PHASE0_RECONNAISSANCE.md   — where every fact below came from, with citations

# schema_version 2 (2026-08-20): D1, D2, D3 adopted with EXTERNAL sign-off from the
# author (see PREREGISTRATION.md section 9). D2 changes the inner-CV selection
# criterion to MSE; D1 restricts the boundary assertion to the LOW edge among
# RELIABLE voxels; D3 widens the alpha grid downward to 1e-6. No fitting run
# produced a number under schema_version 1.
schema_version: 2

provenance:
  repo: evaluation-resolution-rsa
  base_commit: 6cf64f8
  paper: arXiv:2608.12408
  # The measurement this work tests the readout-dependence of:
  reference_effect:
    quantity: Random minus Backprop, Conv1 -> V1, Spearman rho, RDM-averaged
    at_32px: -0.001
    at_224px: +0.044
    sem_at_224px: 0.006
    source: results/bnfix_sweep.csv

# ─────────────────────────────────────────────────────────────────────────────
# Model side
# ─────────────────────────────────────────────────────────────────────────────

model:
  # One layer a priori, the same as the paper. Best-layer-per-condition is an
  # escape hatch that equalizes conditions and is not used.
  layer: Conv1
  # Conv1 is the output of the WHOLE first block: Conv2d -> BatchNorm2d -> ReLU
  # -> MaxPool2d(2). So the map is already downsampled by 2 relative to input.
  extraction_point: block_output_post_maxpool
  channels: 32
  # Feature-map side length at each resolution = res / 2. Verified in Phase 0/G.
  native_map_side: {32: 16, 64: 32, 96: 48, 128: 64, 160: 80, 224: 112}

  rules:
    - Random Weights
    - Backprop
    - Feedback Alignment
    - Predictive Coding
    - STDP
    - Random Weights (BN-calibrated)
  seeds: [42, 123, 456, 789, 1337]
  # 6 rules x 5 seeds = 30 checkpoints. NOT 25: Random (BN-calibrated) is a
  # distinct condition (num_batches_tracked = 50, identity BN would be 0).
  n_checkpoints_expected: 30

  resolutions: [32, 64, 96, 128, 160, 224]

  # Bit-identity requirement on the retrain (Change 1). Both branches are real
  # outcomes; see PREREGISTRATION.md.
  determinism_gate:
    seed_under_test: 42
    compare_against: outputs_bnfix/checkpoints  # the six existing checkpoints
    tolerance: 0.0                              # bit-identical, not approximate
    on_mismatch: report_per_tensor_magnitude_and_stop

# ─────────────────────────────────────────────────────────────────────────────
# The two arms (Change 2). They differ ONLY in stimulus set and trial averaging.
# ─────────────────────────────────────────────────────────────────────────────

arms:
  A:
    role: primary
    description: >
      The paper's stimulus set. Preserves comparability with every published
      number. Single-trial betas: each of the 720 is one presentation.
    n_stimuli: 720
    stimulus_source: outputs_720/stim_order_sub-01.txt
    trial_type: train
    presentations_per_stimulus: 1
    beta_averaging: none            # no averaging is possible; n_trials = 1
    grids: [1, 2, 4, 8]
    ceiling:
      method: leave_one_subject_out
      n_subjects: 3
      # MANDATORY LABEL. This is not a noise ceiling. It is a lower bound with a
      # different interpretation and must be labelled as such in every figure
      # axis, table header and CSV column name — not only in prose.
      label: inter-subject consistency (lower bound, not a noise ceiling)
      is_true_ceiling: false

  B:
    role: snr_control
    description: >
      The 12-repetition test set. Zero overlap with the 720, identical images
      across all three subjects. Answers how much of the low absolute
      correlation is single-trial noise — currently an open question, not a
      known quantity.
    n_stimuli: 100
    stimulus_source: stimulus-metadata trial_type == "test"
    trial_type: test
    presentations_per_stimulus: 12
    beta_averaging: mean_over_12_repetitions
    # Deliberate restriction, not an omission: d = 32 (g=1) and 128 (g=2)
    # against n = 100, i.e. 87 training stimuli per outer fold. g = 4 would put
    # d = 512 far above n and is NOT run here.
    grids: [1, 2]
    grids_excluded: [4, 8]
    grids_excluded_reason: d would exceed n; 87 training stimuli per outer fold
    ceiling:
      method: split_half_spearman_brown
      # 12 reps give C(12,6)/2 = 462 distinct balanced splits. Enumerate ALL of
      # them rather than sampling: fully deterministic, no seed required.
      splits: all_balanced
      n_splits: 462
      is_true_ceiling: true

  # Both arms take the ROI masking and per-voxel z-scoring of
  # extract_fmri_rdms_720.py:55-78, in that order: z-score across all 9,840
  # trials first, then select stimuli, then (Arm B only) average repetitions.
  shared_preprocessing:
    roi_masks_from: voxel-metadata columns (V4 <- hV4, LOC <- lLOC | rLOC)
    zscore: per_voxel_across_all_9840_trials
    zscore_before_stimulus_selection: true

# ─────────────────────────────────────────────────────────────────────────────
# Brain side
# ─────────────────────────────────────────────────────────────────────────────

brain:
  subjects: [sub-01, sub-02, sub-03]
  # Fixed ROI order. The pilot (Phase 3) runs V1 only.
  roi_order: [V1, V2, LOC, IT]
  # Phase 0/C, counted from the voxel metadata:
  voxel_counts:
    V1: {sub-01: 1049, sub-02: 1104, sub-03: 839}
    V2: {sub-01: 774,  sub-02: 988,  sub-03: 660}
    LOC: {sub-01: 2700, sub-02: 1175, sub-03: 423}
    IT: {sub-01: 4145, sub-02: 3720, sub-03: 3022}

  voxel_selection:
    # Selection is via reliability ONLY, never via model performance, and the
    # threshold is fixed here, once, for all conditions.
    #
    # WHY WE COMPUTE OUR OWN. The shipped columns nc_testset and nc_singletrial
    # ARE now documented (see reliability_columns below) — but splithalf_* is
    # not, and a self-computed split-half is a quantity whose definition we
    # wrote. It also lands on the same scale as Arm B's ceiling, so selection
    # and normalization are commensurable.
    rule: split_half_spearman_brown_computed_on_arm_B
    threshold: 0.2
    n_splits: 462                # all balanced splits, deterministic
    applied_to: both arms, identical voxel set
    # Arm A: reliability is measured on the 100 test images, i.e. DIFFERENT
    # stimuli from the 720 being fitted. Selection cannot leak. Clean.
    # Arm B: reliability is measured on the same responses being fitted, so
    # selection IS circular there. Arm B therefore reports BOTH, and the
    # unselected result is primary for Arm B.
    arm_A_selection_is_independent: true
    arm_B_selection_is_circular: true
    arm_B_reports_unselected: true

    # Documented cross-check, NOT the operative rule.
    reliability_columns:
      nc_testset:
        definition: >
          Voxelwise noise ceiling from the 12-repetition test set: the maximal
          proportion of beta variance explainable by stimulus identity.
        scale: percent of explainable variance, 0-100
        # Established, not assumed: Hebart et al. 2023 (eLife 12:e82580) reports
        # "up to 80% explainable variance in early visual cortex", and the
        # measured global maximum of this column is 83.67, attained in V1.
        evidence: eLife 82580 + measured max 83.67 in V1 (sub-01)
        status: definition and scale established
      nc_singletrial:
        definition: the same quantity computed for single-trial estimates
        scale: percent of explainable variance, 0-100
        measured_range: 0.0 to 29.9
        evidence: eLife 82580 states single-trial ceilings are lower; measured max 29.9
        status: definition and scale established
      splithalf_uncorrected:
        status: UNVERIFIED — do not threshold on this column
      splithalf_corrected:
        # Measured range -1.114 to 0.841. Correlation-scaled, and it goes below
        # -1, which a Spearman-Brown correction of a negative r can do. No
        # definition found in the THINGS documentation reachable from here.
        status: UNVERIFIED — do not threshold on this column
        measured_range: -1.114 to 0.841
      # Not found in THINGS-data documentation; a sibling project on this machine
      # thresholds nc_testset at 0.05/0.10 as if it were a 0-1 fraction, which on
      # a 0-100 scale selects essentially every voxel. That is the failure mode
      # this block exists to prevent. Do not copy it.

  aggregation:
    over_voxels: median
    over_subjects: mean
    also_report_per_subject: true

# ─────────────────────────────────────────────────────────────────────────────
# Ridge
# ─────────────────────────────────────────────────────────────────────────────

ridge:
  form: dual                       # K = X X^T (n x n), eigendecomposed once per fold
  no_primal_solve: true            # no d x d solve anywhere; d up to 401,408

  standardization:
    per_feature: true
    # Statistics from the TRAINING fold only. Ridge is not scale-invariant and
    # random vs backprop networks have systematically different activation
    # scales and kurtosis; without this the measurement is of scale, not
    # representation.
    fit_on: train_fold_only

  alpha_grid:
    # D3 (adopted 2026-08-20). Low edge moved 1e-2 -> 1e-6 because the measured
    # optimum under MSE selection spans 1e-6 .. 5.0e2, i.e. the old low edge sat
    # ABOVE part of the true optimum range. The high edge stays at 1e8, far above
    # any true optimum, which is correct: no-signal voxels should land there.
    # 29 points over 14 decades = 2 per decade, the previous density. In the dual
    # form an extra alpha is nearly free once the eigendecomposition is done.
    min: 1.0e-6
    max: 1.0e+8
    n_points: 29
    spacing: log
    identical_across_conditions: true
    selected_per: [voxel, fold, condition]

    # ── D2 (adopted 2026-08-20) ──────────────────────────────────────────────
    # SELECTION and REPORTING criteria differ, deliberately.
    selection_criterion: mse
    reporting_metric: pearson_r
    # WHY. Ridge's alpha controls the SCALE of the prediction far more than its
    # direction, and Pearson r is scale-invariant. Measured: under r-selection the
    # per-voxel optimum spans the entire 1e-6..1e12 probe grid -- there is no
    # localisable optimum, so argmax returns an endpoint. Selecting on a
    # scale-invariant quantity is degenerate. Ridge minimises squared error; MSE
    # is the matched criterion. (argmin MSE == argmax R^2 exactly on a fixed
    # validation fold.)
    # CONSEQUENCE THAT MUST BE STATED, NOT BURIED: the selected alpha is therefore
    # not the r-maximising alpha, so reported r sits slightly below the achievable
    # maximum -- equally for every condition, so contrasts are unaffected.
    # COMPARABILITY: sklearn RidgeCV and Brain-Score's ridge regression also select
    # on squared error, so this raises comparability rather than costing it.
    selection_note_required_in_methods: true

    boundary_assertion:
      # ── D1 (adopted 2026-08-20), stricter than the population-threshold form ──
      # States exactly its intent -- NO RELIABLE VOXEL'S OPTIMUM LIES OUTSIDE THE
      # GRID -- with no threshold to justify.
      enabled: true
      on_violation: abort
      scope: per_voxel
      # LOW edge only. Measured margin is 0.000 on every adequate grid vs 1.000 on
      # a truncated one, so a population threshold would be a free parameter
      # justifying a binary quantity.
      sides_that_abort: [low]
      # The HIGH edge is NEVER an alarm: alpha_max for a no-signal voxel is the
      # estimator working correctly, not a grid failure.
      high_boundary_is_never_an_alarm: true
      restricted_to_reliable_voxels: true
      # One qualifying voxel aborts the run.
      n_voxels_to_abort: 1

      # All four cells reported for every condition, always, as diagnostics with
      # NO abort function.
      always_report_cells: [low_reliable, high_reliable, low_unreliable, high_unreliable]

      # If this fires on real data the response is to widen the grid under a FRESH
      # sign-off and re-run. Never to relax it, and never mid-run.
      on_fire: widen_grid_under_fresh_signoff_and_rerun

  regularization_path:
    # The path is the measurement, not the scalar. Two conditions can share a
    # maximum and have completely different curves.
    report_r_of_df: true
    df_formula: sum(s_i^2 / (s_i^2 + alpha))
    report_full_path: true

cross_validation:
  outer_folds: 8
  inner_folds: 5                   # for alpha only
  partition_seed: 20260818
  fixed_partition: true
  # Phase 0/B: the 720 are 720 distinct concepts, one exemplar each, so
  # concept-grouped folds ARE image-level folds. The assertion is kept anyway —
  # it is cheap and it catches a future change to stimulus selection.
  group_by_concept: true
  group_by_concept_is_noop: true
  assert_no_concept_crosses_fold: true

inference:
  # The unit of inference is the seed, as in the paper. CV folds are not
  # independent; they feed the point estimate, not the confidence interval.
  unit: seed
  n_seeds: 5
  cv_folds_feed: point_estimate_only
  # Structurally comparable to the paper's +/-0.006.
  test: paired_one_sided_sign_flip_permutation_over_seeds
  n_sign_flip_assignments: 32
  smallest_attainable_p: 0.03125
  power:
    target: 0.80
    # Delta_min is derived from the pilot's seed-level SD by simulating the
    # sign-flip test above (the paper's own test), with the parametric
    # (t_{0.975,4} + t_{0.80,4}) * SD / sqrt(5) approximation as a cross-check.
    # The number goes in the paper regardless of outcome.
    method: simulate_sign_flip_test_at_pilot_SD
    parametric_crosscheck: true

# ─────────────────────────────────────────────────────────────────────────────
# The grid ladder (§1.1) — the main instrument
# ─────────────────────────────────────────────────────────────────────────────

grid_ladder:
  # Adaptive pooling to a fixed g x g grid before the readout, identical across
  # all resolutions. Dimensionality = C * g^2, constant across the sweep.
  pooling: adaptive_avg_pool2d
  dims_per_grid: {1: 32, 2: 128, 4: 512, 8: 2048}
  # Feasible at every resolution without upsampling: smallest map is 16 x 16, so
  # g = 8 is a true 2 x 2 average even at 32 px.
  min_native_map_side: 16
  # g = 8 is the only rung with d > n on Arm A (2048 vs 720).
  grids_with_d_gt_n: [8]

  # g = 1 must reproduce the paper's condition exactly.
  g1_equals_paper_condition: true
  # Phase 0/E: the paper's pooling call is the tensor method x.mean([2, 3]).
  # On CPU/float32 it was bit-identical to adaptive_avg_pool2d(x, 1) at all six
  # Conv1 shapes; that was NOT tested on a T4. The bridge control therefore
  # calls the original function rather than relying on the equivalence.
  paper_pooling_call: x.mean([2, 3])
  bridge_control_calls_original_function: true

  native_arm:
    # Unbalanced condition, NOT part of the main comparison. Labelled as such.
    enabled: true
    in_main_comparison: false

# ─────────────────────────────────────────────────────────────────────────────
# Saturation instruments (§1.5)
# ─────────────────────────────────────────────────────────────────────────────

capacity_sweep:
  # Differences in feature quality show up in the scarce regime, not the
  # saturated one. Subset selection fixed across conditions by seed.
  subset_sizes: [50, 100, 500, 2000, all]
  selection: random_feature_subset
  selection_seed: 20260818
  identical_subsets_across_conditions: true

control_band:
  # Only results between the pixel baseline and the ceiling are interpretable.
  # Identical readout, identical g, for every control.
  controls:
    - name: pixels
      description: raw pixels
    - name: luminance_contrast
      description: per-image luminance + RMS contrast
    - name: gabor_bank
      description: Gabor filterbank, 4 orientations x 3 spatial frequencies, energy
    - name: permuted_assignment
      description: permuted stimulus<->feature assignment
      # The pipeline's negative test. Must give approximately zero.
      expect: approximately_zero
      is_negative_test: true

  # A dimensionality-matched low-level bank, not a single scalar. Under a fitted
  # readout the luminance scalar is no longer the right trivial baseline: a
  # single feature can gain nothing from ridge except scaling.
  dimensionality_matched: true

spatial_correspondence_control:
  # Change 3. The grid ladder cannot separate "retains spatial structure" from
  # "has more dimensions" — those covary by construction.
  #
  # A FIXED permutation would do nothing: ridge is invariant to feature
  # reordering. A PER-IMAGE permutation destroys the correspondence between grid
  # cell and retinotopic location while preserving dimensionality and the
  # per-channel activation distribution exactly.
  method: shuffle_grid_cells_per_image
  permutation_differs_per_image: true
  grids: [4, 8]
  resolutions: [32, 64, 96, 128, 160, 224]
  arms: [A]
  # If a rung gains nothing over its shuffled counterpart, the gain was
  # capacity, not space.
  interpretation: gain_over_shuffled_isolates_spatial_correspondence

brainscore_secondary:
  # Runs beside the controlled ridge design for external comparability. The
  # ridge design stays primary.
  enabled: true
  metric: pls_regression
  # PLS with fixed component count is capacity-matched by construction.
  n_components: 25
  fixed_component_count: true
  source: brainscore_vision.metrics.regression_correlation
  installed_version: 2.3.18
  # InternalConsistency (the standard Brain-Score ceiling) needs a repetition
  # coordinate, so it cannot be applied to Arm A. Arm B only.
  internal_consistency_ceiling_arms: [B]

# ─────────────────────────────────────────────────────────────────────────────
# Reporting
# ─────────────────────────────────────────────────────────────────────────────

reporting:
  # Ceiling normalization amplifies noise in weakly reliable voxels; an effect
  # that exists only after normalization is suspect.
  report_raw_r: true
  report_r_over_ceiling: true
  # Arm A's denominator is inter-subject consistency, which is NOT a ceiling.
  # nc_testset / nc_singletrial must never be used as an Arm A denominator:
  # they are measured on different stimuli.
  arm_A_denominator: inter-subject consistency (lower bound)
  forbid_nc_columns_as_arm_A_denominator: true

output:
  features_dtype: float32          # never float16
  csv_columns_required:
    - config_hash
    - arm
    - rule
    - seed
    - resolution
    - grid
    - layer
    - roi
    - subject
    - fold
  duplicate_check_key:
    [arm, rule, seed, resolution, grid, layer, roi, subject, fold]
  # Same discipline as v10 finalize_sweep: a duplicated key means the same cell
  # was computed twice, and a deterministic pipeline must agree exactly. Verify
  # every numeric column and RAISE on disagreement rather than collapsing.
  on_duplicate_disagreement: raise
  duplicate_atol: 1.0e-12

# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure
# ─────────────────────────────────────────────────────────────────────────────

infrastructure:
  pattern: modal_deploy_plus_spawn   # not `modal run --detach`
  gpu: T4
  volumes:
    data: burstprop-data             # -> /data  (outputs_720, object_images)
    results: learning-rules-rsa      # -> /results
  retrain_output_subdir: outputs_allseeds
  shard_per: [rule, seed]
  # From spawn_runs.py:34-41. PC and STDP run T_INF/T_SIM inner loops per batch.
  timeouts_seconds:
    Random Weights: 1800
    Random Weights (BN-calibrated): 1800
    Backprop: 3600
    Feedback Alignment: 3600
    Predictive Coding: 14400
    STDP: 14400

# ─────────────────────────────────────────────────────────────────────────────
# Explicitly out of scope (Change 5)
# ─────────────────────────────────────────────────────────────────────────────

out_of_scope:
  eccentricity_resolved_readout:
    # The voxel metadata carries prf-eccentricity, prf-polarangle, prf-size and
    # prf-rsquared. An eccentricity-resolved version of this question is the
    # strongest follow-up available. It is a SEPARATE STUDY and is recorded here
    # and in PREREGISTRATION.md so it cannot later look like a post-hoc idea.
    available_columns: [prf-eccentricity, prf-polarangle, prf-size, prf-rsquared]
    status: not part of this analysis
  best_layer_per_condition:
    status: not part of this analysis
    reason: equalizes conditions; one layer a priori instead
  higher_layers:
    status: not part of this analysis
    reason: Conv1 only, matching the paper's V1 mapping
