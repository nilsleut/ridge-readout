# Step 42b configuration (amendments/2026-11-17_step42b-predictions.md): norm-angle
# decomposition on NSD, predictions Q1-Q4 for subjects 2-8. config_step42.yaml
# (da1cbb33b6d7) stays unchanged and governs P1-P4 and all step 42 cells.
schema_version: 1
step: 42b

q_subjects: [subj02, subj03, subj04, subj05, subj06, subj07, subj08]   # subj01 excluded (motivated Q1-Q4)
all_subjects: [subj01, subj02, subj03, subj04, subj05, subj06, subj07, subj08]
seed_idx: [0, 1, 2, 3, 4]
k: 3

components:
  source: arXiv:2611.15533, Section 3.5, Eq. 2
  implementation: scripts/step25_weighted_angle.py::nwa (N, A, W with F = center), which calls
    scripts/step9_separation.py::normf and ::components; imported unchanged. nwa reads the
    module-level pair index TRI (720 stimuli); for 515 images TRI is set to the 515-image
    upper triangle for the duration of the call and restored afterwards.
  model_side: GAP Conv1 features, units centred over the 515 images
  brain_side: mean of the three presentations, voxels centred over the 515 images
  N: "|n_i - n_j| (the amendment writes (n_i - n_j)^2; Spearman is identical, the map is monotone)"
  A: 1 - cos theta_ij (unweighted)
  W: 2 n_i n_j (1 - cos theta_ij), reported without prediction
  comparison: Spearman over all 132,355 pairs, model component vs the same brain component

inference:
  sign_flip: {assignments_q: 128, assignments_p: 256, sided: one-sided in the predicted direction}
  bootstrap: {n_resamples: 1000, seed: 20261002, unit: stimuli, self_pairs: dropped, same resamples as step 42}

predictions:
  Q1: {roi: V1, cell: [raw, euclidean], direction: positive, min_subjects: 5, p_max: 0.05}
  Q2: {roi: V1, cell: [center, N], direction: positive, min_subjects: 5, p_max: 0.05}
  Q3: {roi: V1, cell: [center, A], direction: negative, min_subjects: 5, p_max: 0.05}
  Q4: {roi: LO-obj, cell: [center, A], direction: negative, min_subjects: 5, p_max: 0.05}
